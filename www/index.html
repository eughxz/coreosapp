else{if(s.msg)h+=`<div class="warn mt-3">${esc(s.msg)}</div>`;h+=`<div class="mt-2">${s.items.map((x,i)=>`<div class="dv py-3"><div class="flex items-center gap-2"><input class="n" style="flex:1;min-width:0" value="${esc(x.n)}" onchange="SC.items[${i}].n=this.value" aria-label="Alimento"><input class="n c" style="width:80px" type="number" inputmode="decimal" value="${Math.round(x.g)}" oninput="scG(${i},this.value)" aria-label="Gramas"><span class="mut text-xs">g</span><button class="mbtn" onclick="scDel(${i})" aria-label="Remover">${IC0('x')}</button></div><div id="scm${i}" class="mut text-xs mt-1">${scLine(x)}</div></div>`).join('')}</div><div id="sct" class="text-sm mt-3">${scTot()}</div><button class="btn alt mt-3" onclick="scAddF()">${IC('plus')}Adicionar alimento da tabela TACO</button>${s.items.length?`<button class="btn mt-3" onclick="scOk()">${IC('check')}Confirmar e Somar ao Dia</button>`:''}<button class="btn alt mt-2" onclick="SC=null;closeM()">Cancelar</button>`}
$('#mbox').innerHTML=h;openSheet()}
function scG(i,v){const x=SC&&SC.items[i];if(!x)return;x.g=Math.max(0,N_(v));const e=$('#scm'+i);if(e)e.textContent=scLine(x);const t=$('#sct');if(t)t.innerHTML=scTot()}
function scDel(i){SC.items.splice(i,1);scanSheet()}
function scAddF(){form('Alimento da tabela TACO',[{l:'Alimento (valores por 100 g)',t:'sel',o:TACO.map((f,i)=>[i,f[0]]),v:0},{l:'Gramas',t:'number',v:100}],v=>{const ti=+v[0],g=Math.max(1,N_(v[1])||100),m=tacoM(ti,g);if(SC&&TACO[ti])SC.items.push({n:TACO[ti][0],g0:g,g:g,k:m.k,p:m.p,c:m.c,f:m.g});setTimeout(scanSheet,0)})}
function scOk(){if(!SC)return;const d=DY();d.extras=d.extras||[];SC.items.forEach(x=>{const r=scF(x);if(x.g>0)d.extras.push({n:'Prato: '+x.n+' '+Math.round(x.g)+' g',k:x.k*r,p:x.p*r,c:x.c*r,g:x.f*r})});SC=null;sv();closeM();render();haptic(25);toast('Prato somado ao dia')}
function nutriTop(){const ex=DY().extras||[];return scanCTA()+`<div class="card mb-3"><b>Extras de hoje</b>${ex.length?ex.map((x,i)=>`<div class="dv flex items-center gap-2 py-2"><div class="flex-1 text-sm">${esc(x.n)}<div class="mut text-xs">${Math.round(N_(x.k))} kcal · P ${Math.round(N_(x.p))} · C ${Math.round(N_(x.c))} · G ${Math.round(N_(x.g))}</div></div><button class="mbtn" onclick="xDel(${i})" aria-label="Remover">${IC0('x')}</button></div>`).join(''):'<div class="mut text-sm mt-1">Nenhum alimento avulso registrado hoje.</div>'}<button class="btn alt mt-3" onclick="xAdd()">${IC('plus')}Registrar alimento avulso</button><div class="mut text-xs mt-2">As refeições somam quando marcadas como concluídas. Tabela TACO, valores por 100 g.</div></div>`}
// importador de treino do coach (com pré-visualização)
let IMP=null;
function impSheet(id){if(!HOST)return;let nome='';if(id){const tg=(CL||[]).find(x=>x.user_id===id);if(!tg)return;if(!(tg.data&&tg.data.coach_consent&&tg.data.coach_consent.v)){alert('O aluno ainda não autorizou o acesso aos dados.');return}nome=(tg.data.profile||{}).nome||''}else{if(!HV)return;nome=HV.nome||''}
IMP={id:id||null,nome:nome,pr:null};$('#mbox').innerHTML=`<b class="text-lg">Importar treino via texto</b><div class="mut text-xs mt-1">Aluno: ${esc(nome)}</div><textarea id="impt" class="n mt-3" rows="12" placeholder="Cole aqui o planejamento (texto ou Markdown)"></textarea><button class="btn alt mt-3" onclick="impPrev()">${IC('search')}Pré-visualizar</button><div id="impv"></div><button class="btn alt mt-3" onclick="closeM()">Fechar</button>`;openSheet()}
function impPrev(){if(!IMP)return;const pr=parseCoachWorkoutText(String(($('#impt')||{}).value||''));IMP.pr=pr;const v=$('#impv');if(!v)return;
if(!pr.sheets.length){v.innerHTML='<div class="warn mt-3">Não encontrei treinos. Use “### DIA — TREINO A (Foco)” e “1. **Exercício:** 3 séries de 10 repetições | Descanso: 60s”.</div>';return}
const hd=[pr.aluno,pr.obj&&('Objetivo: '+pr.obj),pr.freq&&('Frequência: '+pr.freq)].filter(Boolean);
v.innerHTML=`<div class="mt-4">${hd.length?`<div class="mut text-xs">${hd.map(esc).join(' · ')}</div>`:''}${pr.sheets.map(w=>`<div class="dv py-3"><b class="text-white">${esc(w.n)}</b> <span class="mut text-xs">${esc(w.sub||'')}</span>${(w.warm||[]).length?`<div class="mut text-xs mt-1">Aquecimento: ${esc(w.warm.join(' '))}</div>`:''}${w.ex.map((e,i)=>`<div class="text-sm mt-1">${i+1}. ${esc(e.n)} <span class="mut">${e.s}× ${esc(e.r)} · ${e.rest}s</span>${e.obs?`<div class="mut text-xs">${esc(e.obs)}</div>`:''}</div>`).join('')}${w.cardio?`<div class="mut text-xs mt-1">Cardio: ${esc(w.cardio)}</div>`:''}</div>`).join('')}<div class="flex gap-2 mt-3"><button class="btn alt" onclick="impSave(1)">Adicionar às fichas</button><button class="btn" onclick="impSave(0)">${IC('check')}Substituir e salvar</button></div></div>`;icons()}
async function impSave(add){if(!IMP||!IMP.pr||!HOST)return;const pr=IMP.pr,n=pr.sheets.reduce((a,w)=>a+w.ex.length,0),msg=pr.sheets.length+' treinos, '+n+' exercícios';
if(!IMP.id){applyPlan(S,pr,!!add);DY().treino=null;IMP=null;sv();closeM();render();haptic(20);toast('Importado: '+msg);return}
const r=(CL||[]).find(x=>x.user_id===IMP.id);if(!r)return;const data=fixS(JSON.parse(JSON.stringify(r.data)));applyPlan(data,pr,!!add);
try{const q=await SB.from('core_os_data').upsert({user_id:r.user_id,email:r.email,data:data,updated_at:new Date().toISOString()});if(q.error)throw q.error;r.data=data;IMP=null;closeM();haptic(20);toast('Salvo na conta de '+((data.profile||{}).nome||'aluno')+': '+msg);loadCl()}catch(e){alert('Não foi possível salvar no Supabase: '+((e&&e.message)||e))}}
 
 
// ===== v9: scanner via Edge Function, água rápida, RPE, peso, indicador de sync =====
let SYNCING=false;
function cst(){let q=0;try{q=(J(QK)||[]).length}catch(e){}return SYNCING?['#38BDF8','Sincronizando dados','sync']:!cloud?['#64748B','Conta local, sem nuvem','']:!navigator.onLine?['#F59E0B','Offline: dados salvos no aparelho','']:q?['#F59E0B','Fila local pendente','']:['#38BDF8','Sincronizado na nuvem','live']}
function dotUpd(){try{const d=$('#cdot');if(!d||!d.style)return;const c=cst();d.title=c[1];d.setAttribute('aria-label',c[1]);d.className='cdot'+(c[2]?' '+c[2]:'');if(c[2]==='sync'){d.style.background='transparent';if(d.innerHTML.indexOf('refresh')<0){d.innerHTML='<i data-lucide="refresh-cw"></i>';icons()}}else{d.innerHTML='';d.style.background=c[0]}}catch(e){}}
// scanner
const GMODELS=['gemini-3.8-flash','gemini-flash-latest','gemini-3.6-flash','gemini-3-flash-preview'];
function normScan(o){o=o||{};const it=Array.isArray(o.items)?o.items:[];return it.map(x=>{const g=Math.max(1,N_(x.grams)||100);return{n:String(x.name||'Alimento').slice(0,60),g0:g,g:g,k:N_(x.kcal),p:N_(x.p),c:N_(x.c),f:N_(x.f)}})}
async function gemDirect(b64,key){let last='';for(const m of GMODELS){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:GPROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:.2}})});const j=await r.json();if(!r.ok){last=(j&&j.error&&j.error.message)||('HTTP '+r.status);if(r.status===404||r.status===400||r.status===403)continue;throw new Error(last)}const tx=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||'').join('').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');return JSON.parse(tx)}catch(e){last=String((e&&e.message)||e);if(!/HTTP 40[034]|not found|no longer available|not supported|limited|permission/i.test(last))throw e}}throw new Error(last||'nenhum modelo disponível')}
async function scanRun(img){const b64=String(img).split(',')[1]||'';SC={img:img,items:[],st:'load',msg:''};scanSheet();
const manual=m=>{SC.st='manual';SC.msg=m+' Adicione os alimentos manualmente pela tabela TACO.';scanSheet()};
if(!navigator.onLine)return manual('Sem internet.');
let data=null,err='';
if(SB){try{const r=await SB.functions.invoke('analyze-meal',{body:{imageBase64:b64,mimeType:'image/jpeg'}});if(r.error)throw r.error;data=r.data;if(typeof data==='string')data=JSON.parse(data);if(data&&data.error)throw new Error(data.error)}catch(e){err=String((e&&e.message)||e);data=null}}else err='Supabase indisponível';
if(!data&&HOST&&gKey()){try{data=await gemDirect(b64,gKey());err=''}catch(e){err=String((e&&e.message)||e)}}
if(!SC)return;if(!data)return manual('Não foi possível analisar a foto agora ('+err.slice(0,120)+').');
SC.items=normScan(data);SC.st='ok';if(!SC.items.length)return manual('Nenhum alimento identificado.');scanSheet()}
// água rápida
function aguaSheet(){const d=DY(),g=N_(S.wc.v)*N_(S.wc.n);$('#mbox').innerHTML=`<b class="text-lg">Hidratação</b><div class="text-sm mt-1"><span class="text-white">${Math.round(N_(d.water))}</span><span class="mut"> / ${Math.round(g)} ml</span></div><div class="grid grid-cols-3 gap-2 mt-4">${[[250,'Copo','cup-soda'],[500,'Squeeze','droplet'],[600,'Coqueteleira','droplets']].map(x=>`<button class="btn alt" style="flex-direction:column;gap:4px" onclick="aguaAdd(${x[0]})">${IC0(x[2])}<span>+ ${x[0]} ml</span><span class="mut text-xs">${x[1]}</span></button>`).join('')}</div><div class="flex gap-2 mt-4"><input id="agq" class="n" type="number" inputmode="numeric" placeholder="ml personalizado"><button class="btn" style="width:auto" onclick="aguaAdd(N_($('#agq').value))">${IC('plus')}Somar</button></div><div class="flex gap-2 mt-3"><button class="btn alt" onclick="aguaSet()">${IC('pencil')}Corrigir total</button><button class="btn alt" onclick="aguaZero()">${IC('rotate-ccw')}Zerar</button></div><button class="btn alt mt-3" onclick="closeM()">Fechar</button>`;openSheet()}
function aguaAdd(ml){ml=Math.round(N_(ml));if(!(ml>0))return;const d=DY();d.water=Math.max(0,N_(d.water)+ml);haptic();sv();render();aguaSheet();toast('+'+ml+' ml')}
function aguaSet(){const v=N_(($('#agq')||{}).value);if(!(v>=0)||String(($('#agq')||{}).value).trim()===''){toast('Digite o total em ml no campo');return}DY().water=Math.round(v);haptic();sv();render();aguaSheet()}
function aguaZero(){if(!confirm('Zerar a água de hoje?'))return;DY().water=0;haptic();sv();render();aguaSheet()}
// RPE pós-treino
let RPE=null;
function fim(id){const d=DY();if(d.fim===id){d.fim=null;d.rpe=null;sv();render();return}RPE={id:id,v:(d.rpe&&d.rpe.v)||7};rpeSheet()}
function rpeSheet(){const v=RPE.v;$('#mbox').innerHTML=`<b class="text-lg">Como foi o treino?</b><div class="lbl mt-3">Esforço percebido (RPE)</div><div class="flex items-end gap-3 mt-2"><b id="rpev" class="text-white" style="font-size:44px;line-height:1">${v}</b><span class="mut text-sm mb-1">/ 10 · <span id="rpel">${rpeTxt(v)}</span></span></div><input id="rpe" type="range" min="1" max="10" step="1" value="${v}" class="w-full mt-3 no-swipe" style="accent-color:#38BDF8" oninput="RPE.v=+this.value;$('#rpev').textContent=this.value;$('#rpel').textContent=rpeTxt(+this.value);haptic(5)"><div class="flex justify-between mut text-xs"><span>1 leve</span><span>10 máximo</span></div><div class="lbl mt-4">Observação</div><textarea id="rpen" class="n mt-2" rows="3" placeholder="Como foi o treino hoje? Algum desconforto ou carga leve?"></textarea><button class="btn mt-4" onclick="rpeOk()">${IC('check')}Finalizar treino</button><button class="btn alt mt-2" onclick="closeM()">Cancelar</button>`;openSheet()}
const rpeTxt=v=>v<=3?'leve':v<=5?'moderado':v<=7?'difícil':v<=9?'muito difícil':'esforço máximo';
function rpeOk(){if(!RPE)return;const d=DY();d.fim=RPE.id;d.rpe={v:RPE.v,note:String(($('#rpen')||{}).value||'').trim().slice(0,500),ts:new Date().toISOString(),treino:RPE.id};RPE=null;haptic(30);sv();closeM();render();viral()}
function lastRpe(D){const ks=Object.keys((D&&D.days)||{}).filter(k=>D.days[k]&&D.days[k].rpe).sort();if(!ks.length)return null;const k=ks[ks.length-1];return Object.assign({d:k},D.days[k].rpe)}
const rpeBox=D=>{const r=lastRpe(D);return r?`<div class="good mt-2"><div class="lbl" style="color:#BAE6FD">Último feedback · ${r.d.slice(8)}/${r.d.slice(5,7)}</div><div class="text-sm mt-1">RPE <b class="text-white">${N_(r.v)}</b>/10 (${rpeTxt(N_(r.v))})</div>${r.note?`<div class="text-sm mt-1">“${esc(r.note)}”</div>`:''}</div>`:''};
// peso
const wBtn=()=>`<button class="btn mb-3" onclick="wSheet()">${IC('scale')}Registrar Peso de Hoje</button>`;
function wSheet(){const p=[...S.pesos].sort((a,b)=>a.d<b.d?-1:1),l=p[p.length-1];$('#mbox').innerHTML=`<b class="text-lg">Peso de hoje</b><div class="mut text-xs mt-1">${l?'Último: '+l.kg+' kg em '+l.d.slice(8)+'/'+l.d.slice(5,7):'Primeiro registro'}</div><div class="flex items-center gap-2 mt-4"><input id="wkg" class="n c" style="font-size:28px" type="number" step="0.1" inputmode="decimal" value="${l?l.kg:N_(S.profile.peso)||''}"><span class="mut">kg</span></div><button class="btn mt-4" onclick="wOk()">${IC('check')}Salvar</button><button class="btn alt mt-2" onclick="closeM()">Cancelar</button>`;openSheet()}
function wOk(){const v=N_(($('#wkg')||{}).value);if(!(v>20&&v<400)){toast('Peso inválido');return}const d=TD(),e=S.pesos.find(x=>x.d===d);if(e)e.kg=v;else S.pesos.push({d:d,kg:v});S.profile.peso=v;haptic(20);sv();closeM();render();toast('Peso salvo: '+v+' kg')}
