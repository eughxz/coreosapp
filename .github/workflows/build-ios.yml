name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Clean and Install on macOS
      shell: bash
      run: |
        rm -rf node_modules ios
        npm install @capacitor/core @capacitor/cli @capacitor/ios
        npx cap add ios

    - name: Build iOS Archive
      shell: bash
      run: |
        cd ios/App
        if [ -d "App.xcworkspace" ]; then
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Debug archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Debug archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        fi

    - name: Export Clean IPA (Unsigned)
      shell: bash
      run: |
        cd ios/App
        mkdir -p Payload
        cp -R build/App.xcarchive/Products/Applications/App.app Payload/
        # Remove assinaturas anteriores para o AltStore assinar limpo
        rm -rf Payload/App.app/_CodeSignature
        rm -f Payload/App.app/embedded.mobileprovision
        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: ios/App/App.ipa