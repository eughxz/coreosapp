name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor iOS
      run: npx cap sync ios

    - name: Build iOS Archive
      shell: bash
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Debug archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_STYLE=Manual

    - name: Export IPA (Debug)
      shell: bash
      run: |
        cd ios/App
        mkdir -p Payload
        cp -R build/App.xcarchive/Products/Applications/App.app Payload/
        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: ios/App/App.ipa